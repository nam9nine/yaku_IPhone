name: PR checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check portable AI data and training invariants
        run: |
          python3 -m venv .tooling/ai-ci
          .tooling/ai-ci/bin/python -m pip install --require-hashes -r ai/requirements-ci.lock
          .tooling/ai-ci/bin/ruff check ai
          .tooling/ai-ci/bin/ruff format --check ai
          PYTHONPATH=ai .tooling/ai-ci/bin/python -m unittest discover -s ai/tests -v

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - id: scope
        run: node scripts/browser-scope.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: steps.scope.outputs.required == 'true'
        run: npm ci
      - if: steps.scope.outputs.required == 'true'
        name: Configure official Ubuntu APT mirror
        run: sudo "$(command -v node)" scripts/configure-apt-mirror.mjs
      - if: steps.scope.outputs.required == 'true'
        name: Install browser system dependencies
        run: time npx playwright install-deps chromium webkit
      - if: steps.scope.outputs.required == 'true'
        name: Install Playwright browsers
        run: time npx playwright install chromium webkit
      - if: steps.scope.outputs.required == 'true'
        run: npm run test:e2e -- --output=test-results/e2e
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/e2e
      - if: ${{ !cancelled() && steps.scope.outputs.required == 'true' }}
        run: npm run test:visual -- --output=test-results/visual
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/visual
      - if: ${{ always() && steps.scope.outputs.required == 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: browser-evidence-${{ github.event.pull_request.head.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: error

  evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm run evidence:check
        env:
          GITHUB_TOKEN: ${{ github.token }}

  merge-gate:
    if: ${{ always() }}
    needs: [quality, browser, evidence]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: npm run merge-gate:check
        env:
          HARNESS_JOB_RESULTS: '{"quality":"${{ needs.quality.result }}","browser":"${{ needs.browser.result }}","evidence":"${{ needs.evidence.result }}"}'
