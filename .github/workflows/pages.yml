name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      local_verified:
        description: '로컬 검증을 마친 긴급 수정: CI 검사 없이 빌드·배포'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - if: ${{ !inputs.local_verified }}
        run: npm run check
      - if: ${{ inputs.local_verified }}
        run: npm run build
      - if: ${{ !inputs.local_verified }}
        name: Configure official Ubuntu APT mirror
        run: sudo "$(command -v node)" scripts/configure-apt-mirror.mjs
      - if: ${{ !inputs.local_verified }}
        name: Install browser system dependencies
        run: time npx playwright install-deps chromium webkit
      - if: ${{ !inputs.local_verified }}
        name: Install Playwright browsers
        run: time npx playwright install chromium webkit
      - if: ${{ !inputs.local_verified }}
        run: npm run test:e2e -- --output=test-results/e2e
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/e2e
      - if: ${{ !inputs.local_verified }}
        run: npm run test:visual -- --output=test-results/visual
        env:
          PLAYWRIGHT_HTML_REPORT: playwright-report/visual
      - if: ${{ always() && !inputs.local_verified }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: deployment-checks-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
